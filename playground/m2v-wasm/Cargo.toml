[package]
name = "m2v-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
model2vec-rs = { version = "0.4", default-features = false, features = ["wasm"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
